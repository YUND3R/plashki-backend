name: Unit tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend-unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio ruff flake8 pylint

      - name: Ruff
        run: python -m ruff check app tests --select E4,E7,E9,F --ignore F401,F841

      - name: Flake8 (critical errors)
        run: python -m flake8 app tests --select=E9,F63,F7,F82 --show-source --statistics

      - name: Pylint (errors only)
        run: python -m pylint app tests --errors-only --disable=no-member,not-callable

      - name: Run unit tests
        run: pytest -q
