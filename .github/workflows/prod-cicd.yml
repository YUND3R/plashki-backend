name: Prod CI/CD

on:
  pull_request:
    branches:
      - main
      - prod
    paths:
      - "backend/**"
      - ".github/workflows/prod-cicd.yml"
  push:
    branches:
      - main
      - prod
    paths:
      - "backend/**"
      - ".github/workflows/prod-cicd.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to production after build"
        required: true
        default: true
        type: boolean

concurrency:
  group: prod-cicd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/plashki-api

jobs:
  quality:
    name: Quality Gates (Ruff + Flake8 + Pylint + Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest ruff flake8 pylint

      - name: Ruff
        run: python -m ruff check app tests --select E4,E7,E9,F --ignore F401,F841

      - name: Flake8 (critical errors)
        run: python -m flake8 app tests --select=E9,F63,F7,F82 --show-source --statistics

      - name: Pylint (errors only)
        run: python -m pylint app tests --errors-only --disable=no-member,not-callable

      - name: Run tests
        run: pytest -q

  build-and-push:
    name: Build and Push API Image
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.export.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export deploy tag
        id: export
        run: echo "image_tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy == true)
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure remote app directory exists
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          port: ${{ secrets.PROD_SSH_PORT }}
          script: mkdir -p "${{ secrets.PROD_APP_DIR }}"

      - name: Upload production compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          port: ${{ secrets.PROD_SSH_PORT }}
          source: backend/docker-compose.prod.yml
          target: ${{ secrets.PROD_APP_DIR }}
          strip_components: 1

      - name: Deploy stack on remote host
        uses: appleboy/ssh-action@v1.2.0
        env:
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
          PROD_APP_DIR: ${{ secrets.PROD_APP_DIR }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          port: ${{ secrets.PROD_SSH_PORT }}
          envs: PROD_ENV_FILE,PROD_APP_DIR,GHCR_USERNAME,GHCR_TOKEN,IMAGE_TAG
          script: |
            set -euo pipefail
            cd "$PROD_APP_DIR"
            printf '%s\n' "$PROD_ENV_FILE" > .env
            docker login ghcr.io -u "$GHCR_USERNAME" -p "$GHCR_TOKEN"
            export IMAGE_TAG="$IMAGE_TAG"
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker compose -f docker-compose.prod.yml ps
            docker image prune -f
