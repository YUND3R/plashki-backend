name: Dev CI/CD (test VPS)

on:
  push:
    branches:
      - dev
    paths:
      - "backend/**"
      - ".github/workflows/dev-cicd.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to test VPS"
        required: true
        default: true
        type: boolean

concurrency:
  group: dev-cicd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio ruff flake8 pylint

      - name: Ruff
        run: python -m ruff check app tests --select E4,E7,E9,F --ignore F401,F841

      - name: Flake8 (critical errors)
        run: python -m flake8 app tests --select=E9,F63,F7,F82 --show-source --statistics

      - name: Pylint (errors only)
        run: python -m pylint app tests --errors-only --disable=no-member,not-callable

      - name: Run tests
        run: pytest -q

  deploy-test:
    name: Deploy to Test VPS
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy == true)
    environment:
      name: test
    steps:
      - uses: actions/checkout@v4

      - name: Ensure remote app directory exists
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.TEST_SSH_HOST }}
          username: ${{ secrets.TEST_SSH_USER }}
          key: ${{ secrets.TEST_SSH_PRIVATE_KEY }}
          port: ${{ secrets.TEST_SSH_PORT }}
          script: mkdir -p "${{ secrets.TEST_APP_DIR }}"

      - name: Pack backend for upload
        run: |
          tar -czf backend-deploy.tgz \
            -C backend \
            docker-compose.test.yml \
            Dockerfile \
            requirements.txt \
            alembic.ini \
            migrations \
            app

      - name: Write and validate test .env
        env:
          TEST_ENV_FILE: ${{ secrets.TEST_ENV_FILE }}
        run: |
          set -euo pipefail
          printf '%s\n' "$TEST_ENV_FILE" | tr -d '\r' > test.env
          grep -q '^POSTGRES_USER=' test.env
          grep -q '^POSTGRES_PASSWORD=' test.env
          grep -q '^POSTGRES_DB=' test.env
          grep -q '^ENVIRONMENT=' test.env
          ! grep -q 'ТОТ_ЖЕ_ПАРОЛЬ' test.env || (echo "TEST_ENV_FILE: replace placeholder passwords" && exit 1)
          ! grep -q 'CHANGE_ME' test.env || (echo "TEST_ENV_FILE: replace CHANGE_ME placeholders" && exit 1)
          test "$(grep '^POSTGRES_PASSWORD=' test.env | cut -d= -f2-)" = "$(grep '^DATABASE_URL=' test.env | sed -n 's#.*://[^:]*:\([^@]*\)@.*#\1#p')"

      - name: Upload backend archive
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.TEST_SSH_HOST }}
          username: ${{ secrets.TEST_SSH_USER }}
          key: ${{ secrets.TEST_SSH_PRIVATE_KEY }}
          port: ${{ secrets.TEST_SSH_PORT }}
          source: backend-deploy.tgz
          target: ${{ secrets.TEST_APP_DIR }}

      - name: Upload test .env
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.TEST_SSH_HOST }}
          username: ${{ secrets.TEST_SSH_USER }}
          key: ${{ secrets.TEST_SSH_PRIVATE_KEY }}
          port: ${{ secrets.TEST_SSH_PORT }}
          source: test.env
          target: ${{ secrets.TEST_APP_DIR }}

      - name: Deploy stack on remote host
        uses: appleboy/ssh-action@v1.2.0
        env:
          TEST_APP_DIR: ${{ secrets.TEST_APP_DIR }}
        with:
          host: ${{ secrets.TEST_SSH_HOST }}
          username: ${{ secrets.TEST_SSH_USER }}
          key: ${{ secrets.TEST_SSH_PRIVATE_KEY }}
          port: ${{ secrets.TEST_SSH_PORT }}
          envs: TEST_APP_DIR
          script: |
            set -euo pipefail
            cd "$TEST_APP_DIR"
            tar -xzf backend-deploy.tgz
            rm -f backend-deploy.tgz
            mv -f test.env .env
            sed -i 's/\r$//' .env
            export CACHEBUST="$(date +%s)"
            docker compose -f docker-compose.test.yml build migrate api
            if ! docker compose -f docker-compose.test.yml up -d --remove-orphans; then
              docker compose -f docker-compose.test.yml logs --tail=120 migrate
              exit 1
            fi
            docker compose -f docker-compose.test.yml ps
            set -a && . ./.env && set +a
            for attempt in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:${API_PORT:-8000}/health"; then
                echo ""
                exit 0
              fi
              sleep 2
            done
            docker compose -f docker-compose.test.yml logs --tail=100 migrate api
            exit 1
