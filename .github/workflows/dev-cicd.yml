name: Dev CI/CD (test VPS)

on:
  push:
    branches:
      - dev
    paths:
      - "backend/**"
      - ".github/workflows/dev-cicd.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to test VPS"
        required: true
        default: true
        type: boolean

concurrency:
  group: dev-cicd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest ruff flake8 pylint

      - name: Ruff
        run: python -m ruff check app tests --ignore F401,F841

      - name: Flake8 (critical errors)
        run: python -m flake8 app tests --select=E9,F63,F7,F82 --show-source --statistics

      - name: Pylint (errors only)
        run: python -m pylint app tests --errors-only --disable=no-member,not-callable

      - name: Run tests
        run: pytest -q

  deploy-test:
    name: Deploy to Test VPS
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy == true)
    environment:
      name: test
    steps:
      - uses: actions/checkout@v4

      - name: Ensure remote app directory exists
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.TEST_SSH_HOST }}
          username: ${{ secrets.TEST_SSH_USER }}
          key: ${{ secrets.TEST_SSH_PRIVATE_KEY }}
          port: ${{ secrets.TEST_SSH_PORT }}
          script: mkdir -p "${{ secrets.TEST_APP_DIR }}"

      - name: Pack backend for upload
        run: |
          tar -czf backend-deploy.tgz \
            -C backend \
            docker-compose.test.yml \
            Dockerfile \
            requirements.txt \
            app

      - name: Upload backend archive
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.TEST_SSH_HOST }}
          username: ${{ secrets.TEST_SSH_USER }}
          key: ${{ secrets.TEST_SSH_PRIVATE_KEY }}
          port: ${{ secrets.TEST_SSH_PORT }}
          source: backend-deploy.tgz
          target: ${{ secrets.TEST_APP_DIR }}

      - name: Deploy stack on remote host
        uses: appleboy/ssh-action@v1.2.0
        env:
          TEST_ENV_FILE: ${{ secrets.TEST_ENV_FILE }}
          TEST_APP_DIR: ${{ secrets.TEST_APP_DIR }}
        with:
          host: ${{ secrets.TEST_SSH_HOST }}
          username: ${{ secrets.TEST_SSH_USER }}
          key: ${{ secrets.TEST_SSH_PRIVATE_KEY }}
          port: ${{ secrets.TEST_SSH_PORT }}
          envs: TEST_ENV_FILE,TEST_APP_DIR
          script: |
            set -euo pipefail
            cd "$TEST_APP_DIR"
            tar -xzf backend-deploy.tgz
            rm -f backend-deploy.tgz
            printf '%s\n' "$TEST_ENV_FILE" > .env
            docker compose -f docker-compose.test.yml up -d --build --remove-orphans
            docker compose -f docker-compose.test.yml ps
            set -a && . ./.env && set +a
            curl -sf "http://127.0.0.1:${API_PORT:-8000}/health"
            echo ""
