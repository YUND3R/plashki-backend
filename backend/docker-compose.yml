services:
  db:
    image: postgres:16-alpine
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plashki}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plashki}
      POSTGRES_DB: ${POSTGRES_DB:-plashki}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plashki} -d ${POSTGRES_DB:-plashki}"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-plashki}:${POSTGRES_PASSWORD:-plashki}@db:5432/${POSTGRES_DB:-plashki}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads_data:
